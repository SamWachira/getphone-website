name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "getphone-bundles-backend/**"
      - ".github/workflows/cloud-run-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy getphone-bundles-api \
            --source ./getphone-bundles-backend \
            --region us-central1 \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ secrets.GCP_PROJECT_ID }}:us-central1:getphone-bundles-db \
            --set-secrets DATABASE_URL=database-url:latest,TOPUP_API_USERNAME=topup-api-username:latest,TOPUP_API_PASSWORD=topup-api-password:latest,SCHEDULER_SECRET=scheduler-secret:latest \
            --set-env-vars "^;;^TOPUP_API_BASE_URL=https://opsapi.hormuud.com/api/v1;;DEFAULT_TOPUP_AMOUNT=0.25;;SAFETY_GUARD_HOURS=6;;TIMEZONE=Africa/Mogadishu;;CORS_ORIGINS=https://getphone-website.web.app,https://getphone-website.firebaseapp.com,https://getphonelimited.com,https://www.getphonelimited.com" \
            --project ${{ secrets.GCP_PROJECT_ID }}
